name: Udacity Pricing Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * *"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Udacity pricing monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          MIN_HISTORY_POINTS: "5"
          LOOKBACK_DAYS: "180"
          DROP_PCT_THRESHOLD: "0.25"
          Z_SCORE_THRESHOLD: "1.25"
          MIN_VALID_PRICE: "50"
          ALERT_COOLDOWN_DAYS: "7"
        run: |
          python src/udacity-pricing.py

      - name: Commit updated pricing history
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update Udacity pricing history"
            git push
          else
            echo "No pricing history changes to commit."
          fi